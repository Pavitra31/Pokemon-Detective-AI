
services:
  - type: web
    name: pokemon-detective-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: MODEL_PATH
        value: /opt/render/project/src/models/pokemon_efficientnet_b0_1012_fulltrained.pth
